<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>多 Agent 协同作战看板</title>
<style>
:root{--bg:#eef2f6;--surface:#fff;--soft:#f8fafc;--ink:#142033;--muted:#667085;--line:#d8dee8;--blue:#2356d6;--green:#087443;--amber:#a65f00;--red:#b42318;--violet:#7047c6;--cyan:#067a9f;--shadow:0 14px 36px rgba(20,32,51,.10)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:"Segoe UI",Arial,"Microsoft YaHei",sans-serif;letter-spacing:0}.topbar{height:72px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 28px;position:sticky;top:0;z-index:5}.brand{display:flex;align-items:center;gap:14px}.mark{width:40px;height:40px;border-radius:8px;background:#142033;color:#fff;display:grid;place-items:center;font-weight:800}.brand h1{font-size:20px;margin:0}.sub{font-size:12px;color:var(--muted);margin-top:2px}.toolbar{display:flex;gap:10px;flex-wrap:wrap}.badge,.refresh-btn{display:inline-flex;align-items:center;gap:6px;min-height:28px;padding:4px 10px;border:1px solid var(--line);border-radius:999px;background:#fff;font-size:12px;color:var(--muted)}.refresh-btn{cursor:pointer;color:var(--ink);font-weight:650}.refresh-btn:hover{border-color:#9db4e8;color:var(--blue)}.dot{width:8px;height:8px;border-radius:50%;background:var(--green)}.dot.warn{background:var(--amber)}.dot.err{background:var(--red)}.layout{display:grid;grid-template-columns:300px 1fr;gap:18px;padding:18px 22px 28px}.panel{background:#fff;border:1px solid var(--line);border-radius:8px;box-shadow:0 8px 22px rgba(20,32,51,.07);padding:16px}.rail{display:grid;gap:14px;align-content:start}.content{display:grid;gap:16px}.hero{background:#142033;color:#fff;border-radius:8px;box-shadow:var(--shadow);padding:22px;display:grid;grid-template-columns:1.2fr .8fr;gap:18px}.hero h2{font-size:24px;line-height:1.25;margin:0 0 8px}.hero p{margin:0;color:#cbd5e1;font-size:13px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.stat{border:1px solid rgba(255,255,255,.16);border-radius:8px;padding:10px;background:rgba(255,255,255,.06)}.stat strong{display:block;font-size:22px}.stat span{font-size:12px;color:#cbd5e1}.section-title{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}.section-title h3{font-size:15px;margin:0}.section-title span{font-size:12px;color:var(--muted)}.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:16px}.task-groups{display:grid;grid-template-columns:repeat(5,minmax(190px,1fr));gap:12px}.group{border:1px solid #e6ebf2;border-radius:8px;background:var(--soft);padding:12px;min-height:210px}.group h4{margin:0 0 10px;font-size:14px}.task-card,.agent,.blocker,.action,.checkpoint,.event{background:#fff;border:1px solid #ebeff4;border-radius:8px;padding:11px;margin-bottom:9px}.task-card strong,.agent strong,.blocker strong,.action strong{font-size:13px}.meta,.tiny{font-size:12px;color:var(--muted);margin-top:4px;line-height:1.45}.pill{display:inline-flex;align-items:center;justify-content:center;min-height:26px;padding:3px 9px;border-radius:999px;font-size:12px;border:1px solid var(--line);font-weight:650;background:#fff}.p-running,.p-active{color:var(--blue);background:#e8efff;border-color:#bdd0ff}.p-done{color:var(--green);background:#e8f7ef;border-color:#a9e4c5}.p-partially_completed{color:var(--amber);background:#fff4df;border-color:#ffd999}.p-blocked,.p-failed{color:var(--red);background:#fff0ee;border-color:#ffc7c0}.p-queued,.p-verifying{color:var(--violet);background:#f2ecff;border-color:#d6c7ff}.p-warning,.p-needs_human_decision{color:var(--amber);background:#fff4df;border-color:#ffd999}.p-read_only{color:var(--cyan);background:#e5f7fb;border-color:#a8e2ee}.agent{display:grid;grid-template-columns:130px 1fr 150px;gap:12px;align-items:start}.agent-name{font-weight:800}.agent-title{font-weight:700}.blocker{border-left:4px solid var(--red)}.blocker.medium{border-left-color:var(--amber)}.blocker.high{border-left-color:var(--red)}.blocker.critical{border-left-color:#7a271a;background:#fff8f7}.actions{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.action{margin:0;border-left:4px solid var(--blue)}.action.critical{border-left-color:#7a271a}.action.high{border-left-color:var(--red)}.progress{height:8px;background:#e6ebf2;border-radius:999px;overflow:hidden;margin-top:7px}.bar{height:100%;border-radius:999px;background:var(--blue)}.timeline-wrap{overflow-x:auto;padding-bottom:4px}.timeline{min-width:980px;display:grid;grid-template-columns:120px repeat(10,1fr);gap:8px;align-items:center}.time-head{font-size:11px;color:var(--muted);text-align:center}.phase-label{font-weight:800;font-size:13px}.timeline-row{display:contents}.flow-bar{grid-row:auto;border-radius:8px;padding:9px 10px;min-height:44px;border:1px solid #d9e3f5;background:#e8efff;color:var(--blue);font-size:12px;box-shadow:0 4px 12px rgba(20,32,51,.05)}.flow-bar.done{background:#e8f7ef;color:var(--green);border-color:#a9e4c5}.flow-bar.partially_completed{background:#fff4df;color:var(--amber);border-color:#ffd999}.flow-bar.blocked,.flow-bar.needs_human_decision{background:#fff0ee;color:var(--red);border-color:#ffc7c0}.flow-bar.queued{background:#f2ecff;color:var(--violet);border-color:#d6c7ff}.event-list{max-height:360px;overflow:auto;padding-right:4px}.event{display:grid;grid-template-columns:128px 1fr;gap:12px}.event-id{font-weight:800;font-size:12px;color:var(--blue)}.checkpoint-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.checkpoint{margin:0}.footer{font-size:12px;color:var(--muted);padding:0 2px 4px}@media(max-width:1350px){.layout{grid-template-columns:1fr}.task-groups{grid-template-columns:repeat(2,1fr)}.checkpoint-grid{grid-template-columns:1fr}}@media(max-width:820px){.topbar{height:auto;align-items:flex-start;padding:16px;flex-direction:column}.layout{padding:14px}.hero,.grid-2,.actions,.task-groups{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,1fr)}.agent{grid-template-columns:1fr}.event{grid-template-columns:1fr}}
</style>
</head>
<body>
<header class="topbar"><div class="brand"><div class="mark">MO</div><div><h1>多 Agent 协同作战看板</h1><div class="sub">任务拆解 · Agent 状态 · 卡点调度 · 泳道流转 · 事件追踪</div></div></div><div class="toolbar"><span class="badge"><span class="dot" id="freshDot"></span><span id="freshness">只读模式</span></span><span class="badge" id="stamp">加载中</span><span class="badge">刷新间隔 <span id="interval">180</span> 秒</span><button class="refresh-btn" id="refreshBtn" type="button">手动刷新</button></div></header>
<div class="layout"><aside class="rail"><section class="panel"><div class="section-title"><h3>当前焦点</h3></div><div id="project"></div></section><section class="panel"><div class="section-title"><h3>策略约束</h3></div><div id="policy"></div></section><section class="panel"><div class="section-title"><h3>Checkpoint</h3><span id="checkpointCount"></span></div><div id="checkpoints"></div></section></aside><main class="content"><section class="hero"><div><h2 id="projectName"></h2><p id="projectGoal"></p></div><div class="stats" id="summary"></div></section><section class="panel"><div class="section-title"><h3>1. 项目任务拆解</h3><span>已完成 / 正在进行 / 排队 / 卡住</span></div><div class="task-groups" id="taskGroups"></div></section><section class="panel"><div class="section-title"><h3>2. Agent 工作状态</h3><span id="agentCount"></span></div><div id="agents"></div></section><section class="panel"><div class="section-title"><h3>3. 当前卡点</h3><span id="blockerCount"></span></div><div id="blockers"></div></section><section class="panel"><div class="section-title"><h3>4. 全流程泳道图</h3><span>横向时间轴 / 甘特风格</span></div><div class="timeline-wrap"><div class="timeline" id="flowTimeline"></div></div></section><section class="panel"><div class="section-title"><h3>5. 需要调度 Agent 解决的事项</h3><span id="actionCount"></span></div><div class="actions" id="actions"></div></section><section class="panel"><div class="section-title"><h3>6. 最近 10 个事件</h3><span>事件日志 / 因果追踪</span></div><div class="event-list" id="events"></div></section><div class="footer">静态 HTML 看板。数据源：state.json。此页面只读，不修改队列、事件、锁、报告、检查点或任务状态。</div></main></div>
<script>
const esc=v=>String(v??'').replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]));
const cls=s=>'p-'+String(s||'unknown').replace(/[^a-zA-Z0-9_]/g,'_');
const status={active:'活跃',running:'进行中',done:'已完成',partially_completed:'部分完成',blocked:'阻塞',queued:'排队',verifying:'验证中',failed:'验证失败',warning:'预警',read_only:'只读',needs_human_decision:'待人工决策',resumable:'可恢复',current:'当前',needs_decision:'待决策'};
const pri={critical:'紧急',high:'高',normal:'普通',low:'低',medium:'中'};
let retryCount=0,timer=null;
function fmt(t){return String(t||'').replace('T',' ').replace('+08:00','')}
function pct(progress){const text=String(progress||'');const m=text.match(/(\d+)\/(\d+)/);if(m)return Math.min(100,Math.round(+m[1]/+m[2]*100));const p=text.match(/(\d+)%/);return p?+p[1]:0}
function taskCard(t){return `<div class="task-card"><strong>${esc(t.title)}</strong><div class="meta">${esc(t.task_id)} · ${esc(t.owner)} · 优先级 ${esc(pri[t.priority]||t.priority)}</div><div class="meta">${esc(t.result||t.next||t.blocker||'')}</div><div class="progress"><div class="bar" style="width:${pct(t.progress)}%"></div></div><div class="tiny">${esc(t.progress)}</div></div>`}
function setFreshness(s){const f=s.freshness||{};document.getElementById('freshness').textContent=`只读 · 数据${f.age||'未知'}前生成`;document.getElementById('freshDot').className='dot '+(f.status==='stale'?'warn':'')}
function renderTimeline(items){const phases=['规划','执行','验证','监控','调度'];let html='<div></div>'+Array.from({length:10},(_,i)=>`<div class="time-head">T+${i+1}</div>`).join('');for(const phase of phases){html+=`<div class="phase-label">${phase}</div>`;const row=(items||[]).filter(x=>x.phase===phase);let cursor=1;for(const it of row){while(cursor<it.start){html+='<div></div>';cursor++}html+=`<div class="flow-bar ${esc(it.status)}" style="grid-column:span ${it.span}"><strong>${esc(it.title)}</strong><div class="tiny">${esc(it.owner)} · ${(it.tasks||[]).map(esc).join('、')}</div><span class="pill ${cls(it.status)}">${esc(status[it.status]||it.status)}</span></div>`;cursor+=it.span}while(cursor<=10){html+='<div></div>';cursor++}}return html}
async function load(manual=false){try{if(timer)clearTimeout(timer);document.getElementById('refreshBtn').textContent=manual?'刷新中...':'手动刷新';const res=await fetch('state.json?ts='+Date.now());if(!res.ok)throw new Error('HTTP '+res.status);const s=await res.json();retryCount=0;document.getElementById('stamp').textContent='快照 '+fmt(s.generated_at);document.getElementById('interval').textContent=s.refresh_interval_seconds;setFreshness(s);document.getElementById('projectName').textContent=s.project.name;document.getElementById('projectGoal').textContent=s.project.goal;document.getElementById('project').innerHTML=`<div class="meta"><strong>当前模式</strong><br>${esc(s.project.mode)}</div><div class="meta"><strong>当前焦点</strong><br>${esc(s.project.current_focus)}</div>`;document.getElementById('policy').innerHTML=`<div class="meta">调度：${esc(s.policy.priority_policy)}</div><div class="meta">验证：${esc(s.policy.verification)}</div><div class="meta">锁：${esc(s.policy.locks)}</div><div class="meta">自动修复：${s.policy.auto_fix?'开启':'关闭'}</div>`;document.getElementById('summary').innerHTML=[['total_tasks','任务总数'],['completed','已完成'],['in_progress','进行中'],['blocked','卡住'],['queued','排队'],['needs_dispatch','待调度'],['open_risks','风险'],['active_agents','活跃 Agent']].map(([k,l])=>`<div class="stat"><strong>${s.summary[k]??0}</strong><span>${l}</span></div>`).join('');document.getElementById('taskGroups').innerHTML=s.task_groups.map(g=>`<div class="group"><h4>${esc(g.name)} <span class="pill ${cls(g.status)}">${esc(status[g.status]||g.status)}</span></h4>${g.tasks.map(taskCard).join('')}</div>`).join('');document.getElementById('agentCount').textContent=`${s.agents.length} 个 Agent`;document.getElementById('agents').innerHTML=s.agents.map(a=>`<div class="agent"><div><div class="agent-name">${esc(a.agent_id)}</div><div class="meta">${esc(a.role)} · 最近 ${fmt(a.last_seen)}</div><span class="pill ${cls(a.status)}">${esc(status[a.status]||a.status)}</span></div><div><div class="agent-title">${esc(a.task_title)}</div><div class="meta">${esc(a.task_description)}</div><div class="meta">当前进度：${esc(a.progress)}</div><div class="progress"><div class="bar" style="width:${pct(a.progress)}%"></div></div></div><div class="meta"><strong>卡点</strong><br>${esc(a.blocked_by)}<br><br><strong>下一步</strong><br>${esc(a.next_action)}</div></div>`).join('');document.getElementById('blockerCount').textContent=`${s.blockers.length} 个卡点`;document.getElementById('blockers').innerHTML=s.blockers.map(b=>`<div class="blocker ${esc(b.level)}"><strong>${esc(b.task_title)}</strong> <span class="pill ${b.level==='critical'?'p-blocked':'p-warning'}">${esc(pri[b.level]||b.level)}</span><div class="meta">Agent：${esc(b.agent)} · Task：${esc(b.task_id)}</div><div class="meta"><strong>原因：</strong>${esc(b.reason)}</div><div class="meta"><strong>影响：</strong>${esc(b.impact)}</div><div class="meta"><strong>需要决策：</strong>${esc(b.decision_needed)}</div></div>`).join('');document.getElementById('flowTimeline').innerHTML=renderTimeline(s.flow_timeline||[]);document.getElementById('actionCount').textContent=`${s.dispatch_actions.length} 项`;document.getElementById('actions').innerHTML=s.dispatch_actions.map(a=>`<div class="action ${esc(a.priority)}"><strong>${esc(a.action)}</strong> <span class="pill ${a.priority==='critical'?'p-blocked':a.priority==='high'?'p-warning':'p-running'}">${esc(pri[a.priority]||a.priority)}</span><div class="meta"><strong>负责人：</strong>${esc(a.owner)}</div><div class="meta"><strong>原因：</strong>${esc(a.reason)}</div><div class="meta"><strong>目标 Agent：</strong>${esc(a.target_agents.join('、'))}</div><div class="meta"><strong>期望结果：</strong>${esc(a.expected_result)}</div></div>`).join('');document.getElementById('checkpointCount').textContent=`${(s.checkpoints||[]).length} 个`;document.getElementById('checkpoints').innerHTML=(s.checkpoints||[]).map(c=>`<div class="checkpoint"><strong>${esc(c.checkpoint_id)}</strong> <span class="pill ${cls(c.status)}">${esc(status[c.status]||c.status)}</span><div class="meta">${fmt(c.created_at)}</div><div class="meta">完成 ${c.completed_tasks} · 部分 ${c.partially_completed_tasks} · 阻塞 ${c.blocked_tasks}</div><div class="meta">恢复点：${esc(c.resume_from)}<br>${esc(c.evidence)}</div></div>`).join('');document.getElementById('events').innerHTML=(s.recent_events||[]).slice(0,10).map(e=>`<div class="event"><div><div class="event-id">${esc(e.event_id)}</div><div class="tiny">${fmt(e.time)}</div><span class="pill p-running">${esc(e.agent)}</span></div><div><strong>${esc(e.event)}</strong><div class="meta">Task：${esc(e.task_id)} · 原因：${esc(e.caused_by)}</div><div class="meta">${esc(e.summary)}</div></div></div>`).join('');timer=setTimeout(()=>load(false),(s.refresh_interval_seconds||180)*1000)}catch(e){retryCount++;document.getElementById('freshDot').className='dot err';document.getElementById('freshness').textContent=`刷新失败，准备第 ${retryCount} 次重试`;document.getElementById('stamp').textContent='错误：'+e.message;const delay=Math.min(30000,5000*retryCount);timer=setTimeout(()=>load(false),delay)}finally{document.getElementById('refreshBtn').textContent='手动刷新'}}
document.getElementById('refreshBtn').addEventListener('click',()=>load(true));
load(false);
</script>
</body>
</html>
