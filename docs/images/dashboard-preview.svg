<svg width="1440" height="900" viewBox="0 0 1440 900" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Multi-Agent Orchestrator dashboard preview with workspace Loop v1">
  <defs>
    <linearGradient id="hero" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#142033"/>
      <stop offset="58%" stop-color="#2356d6"/>
      <stop offset="100%" stop-color="#087443"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="22" flood-color="#142033" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="1440" height="900" fill="#eef2f6"/>

  <rect x="36" y="28" width="1368" height="68" rx="12" fill="#ffffff" stroke="#d8dee8"/>
  <rect x="58" y="44" width="40" height="40" rx="8" fill="#142033"/>
  <text x="69" y="69" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#ffffff">MO</text>
  <text x="116" y="59" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="700" fill="#142033">Multi-Agent Orchestrator</text>
  <text x="116" y="79" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#667085">Task Specs · Workers · Verifier · Dashboard · Workspace Loop v1</text>
  <rect x="1080" y="46" width="116" height="30" rx="15" fill="#e8efff" stroke="#bdd0ff"/>
  <text x="1112" y="66" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" fill="#2356d6">loop running</text>
  <rect x="1210" y="46" width="86" height="30" rx="15" fill="#e8f7ef" stroke="#a9e4c5"/>
  <text x="1234" y="66" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" fill="#087443">read only</text>
  <rect x="1308" y="46" width="68" height="30" rx="15" fill="#ffffff" stroke="#d8dee8"/>
  <text x="1324" y="66" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#475467">5 min</text>

  <rect x="36" y="118" width="1368" height="170" rx="14" fill="url(#hero)" filter="url(#shadow)"/>
  <text x="64" y="165" font-family="Segoe UI, Arial, sans-serif" font-size="32" font-weight="700" fill="#ffffff">Workspace Loop for safe logical multi-agent execution</text>
  <text x="64" y="196" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#dbeafe">Observe state, append events, rebuild queues, refresh dashboards, and auto-advance only explicit low-risk tasks.</text>
  <text x="64" y="224" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#d7f5df">Dry-run first · One bounded cycle · No business writes · No lock auto-release</text>

  <g transform="translate(760 144)">
    <g>
      <rect width="130" height="100" rx="10" fill="rgba(255,255,255,0.10)" stroke="rgba(255,255,255,0.18)"/>
      <text x="18" y="38" font-size="28" font-weight="700" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif">42</text>
      <text x="18" y="62" font-size="12" fill="#dbeafe" font-family="Segoe UI, Arial, sans-serif">loop iteration</text>
      <text x="18" y="80" font-size="11" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif">loop_state.json</text>
    </g>
    <g transform="translate(146 0)">
      <rect width="130" height="100" rx="10" fill="rgba(255,255,255,0.10)" stroke="rgba(255,255,255,0.18)"/>
      <text x="18" y="38" font-size="28" font-weight="700" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif">3</text>
      <text x="18" y="62" font-size="12" fill="#dbeafe" font-family="Segoe UI, Arial, sans-serif">auto-advanced</text>
      <text x="18" y="80" font-size="11" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif">safe actions</text>
    </g>
    <g transform="translate(292 0)">
      <rect width="130" height="100" rx="10" fill="rgba(255,255,255,0.10)" stroke="rgba(255,255,255,0.18)"/>
      <text x="18" y="38" font-size="28" font-weight="700" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif">2</text>
      <text x="18" y="62" font-size="12" fill="#dbeafe" font-family="Segoe UI, Arial, sans-serif">stale detected</text>
      <text x="18" y="80" font-size="11" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif">heartbeat gap</text>
    </g>
    <g transform="translate(438 0)">
      <rect width="130" height="100" rx="10" fill="rgba(255,255,255,0.10)" stroke="rgba(255,255,255,0.18)"/>
      <text x="18" y="38" font-size="28" font-weight="700" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif">0</text>
      <text x="18" y="62" font-size="12" fill="#dbeafe" font-family="Segoe UI, Arial, sans-serif">rebuild drift</text>
      <text x="18" y="80" font-size="11" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif">full check</text>
    </g>
  </g>

  <g transform="translate(36 318)">
    <rect width="360" height="250" rx="12" fill="#ffffff" stroke="#d8dee8"/>
    <text x="22" y="36" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700" fill="#142033">Loop Cycle</text>
    <text x="22" y="60" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#667085">One heartbeat, one bounded cycle</text>
    <g transform="translate(22 86)">
      <circle cx="10" cy="10" r="8" fill="#2356d6"/>
      <text x="32" y="15" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#142033">Observe queue, events, locks, checkpoints</text>
      <line x1="10" y1="20" x2="10" y2="50" stroke="#d8dee8"/>
      <circle cx="10" cy="60" r="8" fill="#2356d6"/>
      <text x="32" y="65" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#142033">Detect stale tasks and blockers</text>
      <line x1="10" y1="70" x2="10" y2="100" stroke="#d8dee8"/>
      <circle cx="10" cy="110" r="8" fill="#087443"/>
      <text x="32" y="115" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#142033">Auto-advance only double-gated tasks</text>
      <line x1="10" y1="120" x2="10" y2="150" stroke="#d8dee8"/>
      <circle cx="10" cy="160" r="8" fill="#7047c6"/>
      <text x="32" y="165" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#142033">Rebuild queue and refresh dashboard</text>
    </g>
  </g>

  <g transform="translate(416 318)">
    <rect width="492" height="250" rx="12" fill="#ffffff" stroke="#d8dee8"/>
    <text x="22" y="36" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700" fill="#142033">Agent Work Status</text>
    <text x="22" y="60" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#667085">Readable work summaries instead of raw task IDs</text>
    <g transform="translate(22 84)">
      <rect width="448" height="46" rx="9" fill="#f8fafc" stroke="#ebeff4"/>
      <text x="14" y="20" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#142033">Worker-2</text>
      <text x="14" y="36" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#667085">Export records 2001-5000 after checkpoint resume</text>
      <rect x="342" y="12" width="76" height="22" rx="11" fill="#e8efff" stroke="#bdd0ff"/>
      <text x="366" y="27" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="700" fill="#2356d6">running</text>
    </g>
    <g transform="translate(22 142)">
      <rect width="448" height="46" rx="9" fill="#f8fafc" stroke="#ebeff4"/>
      <text x="14" y="20" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#142033">Verifier</text>
      <text x="14" y="36" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#667085">Validate reusable output before next worker range</text>
      <rect x="342" y="12" width="76" height="22" rx="11" fill="#f2ecff" stroke="#d6c7ff"/>
      <text x="363" y="27" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="700" fill="#7047c6">queued</text>
    </g>
    <g transform="translate(22 200)">
      <rect width="448" height="18" rx="9" fill="#e6ebf2"/>
      <rect width="264" height="18" rx="9" fill="#2356d6"/>
      <text x="0" y="40" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#667085">59% task flow coverage</text>
    </g>
  </g>

  <g transform="translate(928 318)">
    <rect width="476" height="250" rx="12" fill="#ffffff" stroke="#d8dee8"/>
    <text x="22" y="36" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700" fill="#142033">Loop Health</text>
    <text x="22" y="60" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#667085">Guardrails are visible, not hidden in automation</text>
    <g transform="translate(22 86)">
      <rect width="432" height="34" rx="8" fill="#f8fafc" stroke="#ebeff4"/>
      <text x="14" y="22" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#142033">queue_rebuild_ok</text>
      <text x="348" y="22" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" fill="#087443">true</text>
    </g>
    <g transform="translate(22 132)">
      <rect width="432" height="34" rx="8" fill="#f8fafc" stroke="#ebeff4"/>
      <text x="14" y="22" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#142033">consecutive_failures</text>
      <text x="366" y="22" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" fill="#087443">0</text>
    </g>
    <g transform="translate(22 178)">
      <rect width="432" height="34" rx="8" fill="#fff4df" stroke="#ffd999"/>
      <text x="14" y="22" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#142033">lock release</text>
      <text x="292" y="22" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" fill="#a65f00">request only</text>
    </g>
  </g>

  <g transform="translate(36 596)">
    <rect width="650" height="256" rx="12" fill="#ffffff" stroke="#d8dee8"/>
    <text x="22" y="36" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700" fill="#142033">Gantt-style Flow Timeline</text>
    <text x="22" y="60" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#667085">Plan → Execute → Verify → Monitor → Dispatch</text>
    <text x="24" y="96" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#667085">Plan</text>
    <rect x="94" y="80" width="120" height="28" rx="8" fill="#e8f7ef" stroke="#a9e4c5"/>
    <text x="122" y="98" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#087443">done</text>
    <text x="24" y="138" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#667085">Execute</text>
    <rect x="154" y="122" width="168" height="28" rx="8" fill="#fff4df" stroke="#ffd999"/>
    <text x="194" y="140" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#a65f00">partial</text>
    <rect x="338" y="122" width="188" height="28" rx="8" fill="#e8efff" stroke="#bdd0ff"/>
    <text x="406" y="140" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#2356d6">running</text>
    <text x="24" y="180" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#667085">Verify</text>
    <rect x="452" y="164" width="104" height="28" rx="8" fill="#f2ecff" stroke="#d6c7ff"/>
    <text x="480" y="182" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#7047c6">queued</text>
    <text x="24" y="222" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#667085">Loop</text>
    <rect x="128" y="206" width="428" height="28" rx="8" fill="#e8efff" stroke="#bdd0ff"/>
    <text x="286" y="224" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#2356d6">observe + rebuild + refresh</text>
  </g>

  <g transform="translate(706 596)">
    <rect width="698" height="256" rx="12" fill="#ffffff" stroke="#d8dee8"/>
    <text x="22" y="36" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700" fill="#142033">Recent Loop Events</text>
    <text x="22" y="60" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#667085">Scheduler decisions stay separate from worker output</text>
    <line x1="30" y1="90" x2="30" y2="210" stroke="#d8dee8"/>
    <circle cx="30" cy="96" r="7" fill="#2356d6"/>
    <text x="50" y="100" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#142033">loop.cycle.started</text>
    <text x="50" y="118" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#667085">Loaded queue, task events, checkpoints, locks, reports.</text>
    <circle cx="30" cy="146" r="7" fill="#a65f00"/>
    <text x="50" y="150" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#142033">loop.stale.detected</text>
    <text x="50" y="168" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#667085">Worker-3 has no heartbeat within 30 minutes.</text>
    <circle cx="30" cy="196" r="7" fill="#087443"/>
    <text x="50" y="200" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#142033">loop.auto_advance.applied</text>
    <text x="50" y="218" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#667085">Queued low-risk verifier moved after safe-action validation.</text>
  </g>
</svg>
